<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuroPawn Shape Battle</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="wrap head">
      <div>
        <h1>NeuroPawn <span>Shape Battle</span></h1>
        <div class="muted" id="eventName"></div>
      </div>
      <span id="modePill" class="pill"></span>
    </div>
  </header>

  <main class="wrap">
    <details class="card" id="setup" open>
      <summary>Match setup</summary>
      <div class="row">
        <input id="newP1" placeholder="Player 1 name" maxlength="24">
        <input id="newP2" placeholder="Player 2 name" maxlength="24">
        <button id="btnNew" class="primary">New match</button>
      </div>
      <div class="row">
        <input id="joinCode" placeholder="Match code" maxlength="8">
        <button id="btnJoin">Open match</button>
        <span id="joinMsg" class="err"></span>
      </div>
      <div class="row">
        <label>This device is
          <select id="role">
            <option value="both">Both players (shared screen)</option>
            <option value="1">Player 1 only</option>
            <option value="2">Player 2 only</option>
            <option value="display">Display only (Battle + results)</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="blind"> Blind mode: hide the EEG prediction and lock it in automatically</label>
      </div>
    </details>

    <section id="arena" class="hidden">
      <div class="top"><span id="codeShow" class="code"></span><div id="scoreboard" class="score"></div></div>
      <p id="turnBanner" class="banner"></p>
      <div class="stage" id="stage">
        <div class="slot card" id="slot1"></div>
        <div class="vs">VS</div>
        <div class="slot card" id="slot2"></div>
      </div>
      <div class="center">
        <button id="btnBattle" class="primary huge" disabled>⚔ Battle</button>
        <button id="btnRematch" class="hidden">Rematch</button>
      </div>
    </section>

    <section class="card"><h2>Rules</h2><div id="rules" class="rules"></div></section>
    <section class="card"><h2>Recent matches</h2><ul id="history" class="list"></ul></section>
  </main>

  <footer class="wrap muted">NeuroTech NCSU · NeuroPawn · [FILL IN: team / links]</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/shapes.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/input.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
